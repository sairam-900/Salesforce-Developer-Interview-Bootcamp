<template>

    <lightning-card title={job.Name}>

        <div class="slds-p-around_medium">

            <p class="slds-m-bottom_small">
                <strong>Company:</strong>
                {job.Company__c}
            </p>

            <p class="slds-m-bottom_small">
                <strong>Role:</strong>
                {job.Role__c}
            </p>

            <p class="slds-m-bottom_medium">
                <strong>Package:</strong>
                {job.Package__c}
            </p>


            <lightning-button
                label="View Details"
                onclick={handleViewDetails}>
            </lightning-button>


            <lightning-button
                label="Apply"
                variant="brand"
                class="slds-m-left_small"
                onclick={handleApply}>
            </lightning-button>

        </div>

    </lightning-card>

</template>
