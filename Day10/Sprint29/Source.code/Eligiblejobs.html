<template>

    <lightning-card title="Eligible Jobs">

        <div class="slds-p-around_medium">

            <!-- SUCCESS NOTIFICATION -->

            <template if:true={showNotification}>

                <div
                    class="slds-notify
                           slds-notify_alert
                           slds-theme_success
                           slds-m-bottom_medium"
                    role="alert">

                    <span class="slds-m-right_small">
                        ✓
                    </span>

                    <span>
                        {notificationMessage}
                    </span>

                </div>

            </template>


            <!-- JOB CARDS -->

            <div class="slds-grid slds-wrap">

                <template
                    for:each={jobs}
                    for:item="job">

                    <div
                        key={job.Id}
                        class="slds-col
                               slds-size_1-of-1
                               slds-medium-size_1-of-2
                               slds-large-size_1-of-3
                               slds-p-around_small">

                        <c-job-card
                            job={job}
                            onviewdetails={handleViewDetails}
                            onapply={handleApply}>
                        </c-job-card>

                    </div>

                </template>

            </div>


            <!-- VIEW DETAILS RESULT -->

            <template if:true={selectedJobId}>

                <div
                    class="slds-box
                           slds-m-top_large">

                    <h2 class="slds-text-heading_medium">
                        Job Details
                    </h2>

                    <p class="slds-m-top_medium">

                        <strong>Job ID:</strong>

                        {selectedJobId}

                    </p>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
