<template>

    <lightning-card title={title} icon-name="utility:info">

        <div class="slds-p-around_medium slds-text-align_center">

            <lightning-icon
                icon-name="utility:info"
                alternative-text="Information"
                size="medium">
            </lightning-icon>

            <p class="slds-text-heading_medium slds-m-top_medium">
                {title}
            </p>

            <p class="slds-m-top_small">
                {message}
            </p>

            <template if:true={showAction}>

                <div class="slds-m-top_medium">

                    <lightning-button
                        variant="brand"
                        label={actionLabel}
                        onclick={handleAction}>
                    </lightning-button>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
