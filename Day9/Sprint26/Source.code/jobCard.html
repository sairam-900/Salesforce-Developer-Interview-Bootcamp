<template>

    <lightning-card title={job.Company__r.Name}>

        <div class="slds-p-around_medium">

            <p>
                <strong>Role:</strong>
                {job.Job_Role__c}
            </p>

            <p>
                <strong>Package:</strong>
                {job.Package__c} LPA
            </p>

            <p>
                <strong>Location:</strong>
                {job.Location__c}
            </p>

            <p>
                <strong>Deadline:</strong>
                {job.Deadline__c}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="View Details"
                    variant="neutral">
                </lightning-button>

                <lightning-button
                    label="Apply"
                    variant="brand"
                    class="slds-m-left_small"
                    onclick={handleApply}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
