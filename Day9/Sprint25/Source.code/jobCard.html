<template>

    <lightning-card>

        <div class="slds-p-around_medium">

            <h2 class="slds-text-heading_medium">
                {job.Company__r.Name}
            </h2>

            <p>
                <strong>Job Title:</strong>
                {job.Name}
            </p>

            <p>
                <strong>Job ID:</strong>
                {job.Job_id__c}
            </p>

            <p>
                <strong>Role:</strong>
                {job.Role__c}
            </p>

            <p>
                <strong>Package:</strong>
                {job.Package__c}
            </p>

            <p>
                <strong>Minimum CGPA:</strong>
                {job.Minimum_CGPA__c}
            </p>

            <p>
                <strong>Location:</strong>
                {job.Location__c}
            </p>

            <p>
                <strong>Status:</strong>
                {job.Job_Status__c}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="View Details"
                    variant="neutral">
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Apply"
                    variant="brand"
                    onclick={handleApply}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
