<template>

    <lightning-card title="Eligible Jobs">

        <div class="slds-p-around_medium">

            <!-- Display eligible jobs -->

            <template if:true={jobs}>

                <template if:true={jobs.length}>

                    <template for:each={jobs} for:item="job">

                        <div
                            key={job.Id}
                            class="slds-box slds-m-bottom_medium"
                        >

                            <h2 class="slds-text-heading_medium">
                                {job.Company__r.Name}
                            </h2>

                            <p class="slds-m-top_small">
                                <strong>Job Title:</strong>
                                {job.Name}
                            </p>

                            <p>
                                <strong>Job ID:</strong>
                                {job.Job_id__c}
                            </p>

                            <p>
                                <strong>Role:</strong>
                                {job.Role__c}
                            </p>

                            <p>
                                <strong>Package:</strong>
                                {job.Package__c}
                            </p>

                            <p>
                                <strong>Minimum CGPA:</strong>
                                {job.Minimum_CGPA__c}
                            </p>

                            <p>
                                <strong>Status:</strong>
                                {job.Job_Status__c}
                            </p>

                            <p>
                                <strong>Last Date:</strong>
                                {job.Last_Date__c}
                            </p>

                            <div class="slds-m-top_medium">

                                <lightning-button
                                    label="View Details"
                                    variant="brand">
                                </lightning-button>

                            </div>

                        </div>

                    </template>

                </template>

                <!-- No eligible jobs -->

                <template if:false={jobs.length}>

                    <div class="slds-text-align_center slds-p-around_medium">

                        No eligible jobs available.

                    </div>

                </template>

            </template>

            <!-- Error -->

            <template if:true={error}>

                <div class="slds-text-color_error">

                    Unable to load eligible jobs.

                </div>

            </template>

        </div>

    </lightning-card>

</template>
